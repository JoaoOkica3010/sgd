version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgd
      POSTGRES_USER: sgd_user
      POSTGRES_PASSWORD: change_me_in_env
    ports:
      - "5432:5432"
    volumes:
      - sgd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgd_user -d sgd"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sgd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sgd_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: sgd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sgd_minio_admin
      MINIO_ROOT_PASSWORD: change_me_in_env
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - sgd_minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: sgd_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: sgd_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1

volumes:
  sgd_pg_data:
  sgd_redis_data:
  sgd_minio_data:
